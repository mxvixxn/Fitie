name: Fitie
options:
  bundleIdPrefix: com.mxvixxn
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "ACTN9LPR35"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_NSHealthShareUsageDescription: "Fitie는 걸음·운동·수면 등 건강 데이터를 읽어 습관 달성을 자동으로 확인합니다."
    INFOPLIST_KEY_NSSupportsLiveActivities: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
targets:
  Fitie:
    type: application
    platform: iOS
    sources:
      - path: Fitie
    entitlements:
      path: Fitie/Fitie.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # iOS 26 Liquid Glass app icon authored in Icon Composer (Fitie.icon).
        ASSETCATALOG_COMPILER_APPICON_NAME: Fitie
    dependencies:
      - target: FitieWidgets
        embed: true
  FitieWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: FitieWidgets
      - path: Fitie/Live/FitieActivityAttributes.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.mxvixxn.Fitie.FitieWidgets
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
    info:
      path: FitieWidgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  FitieTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FitieTests
    dependencies:
      - target: Fitie
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
